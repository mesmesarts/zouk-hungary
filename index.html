<!DOCTYPE html>
<!-- Zouk Calendar v1.13.5 (index.html + style.css v1.0.2 + app.js v1.0.5). When style.css or app.js changes, bump its ?v= below. -->
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Zouk Calendar Hungary</title>
<meta name="description" content="Brazilian zouk & lambada events, parties and classes in Hungary.">
<meta name="theme-color" content="#0b5a35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zouk Calendar">
<link rel="stylesheet" href="style.css?v=1.0.2">
</head>
<body>
<header><div class="deco" aria-hidden="true"></div><div class="wrap">
  <div class="top">
    <div class="ttl">
      <h1>Zouk Calendar Hungary</h1>
      <p id="tagline"></p>
      <div class="updated"><span id="updLabel"></span> <span id="upd"></span></div>
    </div>
    <div class="tools">
      <button id="install" class="hide" type="button"></button>
      <div class="lw">
        <button id="langBtn" class="langbtn" type="button" aria-haspopup="true" aria-expanded="false"></button>
        <div class="langs" id="langs">
          <button id="langHU" data-lang="hu" data-full="Magyar" aria-pressed="false">HU</button>
          <button id="langEN" data-lang="en" data-full="English" aria-pressed="false">EN</button>
          <button id="langES" data-lang="es" data-full="Español" aria-pressed="false">ES</button>
          <button id="langPT" data-lang="pt" data-full="Português" aria-pressed="false">PT</button>
        </div>
      </div>
      <button id="theme" aria-label="Theme"></button>
    </div>
  </div>
</div></header>

<div class="wrap">
  <div class="controls">
    <div class="banner" id="banner" aria-hidden="true"></div>
    <div class="what" id="what" role="group">
      <button data-v="all"></button>
      <button data-v="class"></button>
      <button data-v="party"></button>
    </div>
    <div class="cityrow" id="cities" role="group"></div>
  </div>
  <div class="week" id="weekstrip" hidden></div>
  <main id="list" aria-live="polite"></main>
</div>

<footer>
  <p class="subp"><a id="submitLink" class="submit" target="_blank" rel="noopener"></a></p>
  <p id="disclaimer"></p>
  <p class="copy" id="copy"></p>
</footer>
<div class="tip hide" id="tip" role="status"></div>

<script src="events.js"></script>
<script src="app.js?v=1.0.5"></script>
</body>
</html>
