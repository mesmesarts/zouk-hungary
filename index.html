<!DOCTYPE html>
<!-- Zouk Calendar v1.9.14 -->
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Zouk Calendar Hungary</title>
<meta name="description" content="Brazilian zouk & lambada events, parties and classes in Hungary.">
<style>
  :root{
    color-scheme:light;
    --bg:#fbf8ee; --card:#ffffff; --ink:#1c2a22; --muted:#5d695f; --line:#e3ddc9;
    --head:#0b5a35; --pressed:#0b5a35; --pressedInk:#fff; --accent:#c42f2a; --chip:#e4f1e7; --chipInk:#0b5a35; --gold:#fcd116; --off:#f0ebd9;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0e1612; --card:#16221b; --ink:#e9f1ec; --muted:#9bb0a2; --line:#284236;
      --head:#0a3d26; --pressed:#14683f; --pressedInk:#fff; --accent:#ff8f78; --chip:#1e382b; --chipInk:#bfe9d0; --gold:#fcd116; --off:#2b3830;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0e1612; --card:#16221b; --ink:#e9f1ec; --muted:#9bb0a2; --line:#284236;
    --head:#0a3d26; --pressed:#14683f; --pressedInk:#fff; --accent:#ff8f78; --chip:#1e382b; --chipInk:#bfe9d0; --gold:#fcd116; --off:#2b3830;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  header{position:relative;background:var(--head);color:#fff;padding:14px 0 12px;z-index:30}
  header .deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  header .deco::after{content:"";position:absolute;right:40px;top:15px;width:120px;height:120px;border-radius:50%;background:#2a5fc4;opacity:.5}
  header .deco::before{content:"";position:absolute;right:-50px;top:-10px;width:300px;height:170px;background:var(--gold);opacity:.13;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  header .wrap{position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  h1{margin:0 0 2px;font-size:1.5rem;letter-spacing:-.01em}
  header p{margin:0;opacity:.88;font-size:.86rem;line-height:1.35}
  .tools{display:flex;gap:6px}
  .tools button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px;font:inherit;font-size:.9rem;cursor:pointer}
  .tools button[aria-pressed="true"]{background:var(--gold);color:#1c2a22;border-color:var(--gold)}
  .lw{position:relative;display:flex;gap:6px}
  .langs{display:flex;gap:6px}
  .langbtn{display:none}
  button{font:inherit;color:var(--ink)}
  /* city banner */
  .banner{display:none;position:absolute;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);z-index:-1;overflow:hidden;pointer-events:none}
  .banner svg *{fill:var(--head)!important}.banner svg{opacity:.5}
  .banner.on{display:block}
  .banner svg{position:absolute;inset:0;width:100%;height:100%}
  .banner .cityname{position:absolute;left:max(16px,calc((100vw - 820px)/2 + 16px));bottom:10px;color:#fff;font-weight:700;font-size:1.1rem;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  .controls{position:relative;background:var(--bg);padding:24px 0 19px;border-bottom:1px solid var(--line);z-index:5}
  .controls::before{content:"";position:absolute;top:0;left:50%;width:100vw;transform:translateX(-50%);height:9px;box-sizing:content-box;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(#ce2939 0 3px,#fff 3px 6px,#477050 6px 9px)}
  @media (min-width:700px){.controls{position:sticky;top:0}}
  .what{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;border:1px solid rgba(255,255,255,.6);vertical-align:baseline}
  .what button{padding:8px 6px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
  .what button[aria-pressed="true"]{background:var(--pressed);color:var(--pressedInk);border-color:var(--pressed)}
  .what button:not([aria-pressed="true"]),.filters .pill:not([aria-pressed="true"]){background:color-mix(in srgb,var(--card) 58%,transparent)}
  .filters{display:flex;align-items:center;gap:8px;overflow-x:auto;white-space:nowrap;padding:2px 0 6px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters .grp{display:flex;gap:8px;flex:none}
  .filters .pill{flex:none}
  .sep{flex:none;width:1px;height:22px;background:var(--line)}
  @media (max-width:700px){.filters{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}}
  .body{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .body .meta{flex:1;min-width:0}
  .body a.go{flex:none}
  .tag.mixed{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
  .pill{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px;cursor:pointer}
  .pill[aria-pressed="true"]{background:var(--pressed);color:var(--pressedInk);border-color:var(--pressed)}
  .week{margin:12px 0 0}
  @keyframes zcUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes zcPop{0%{transform:scale(1)}45%{transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes zcDot{from{opacity:0;scale:.2}to{opacity:1;scale:1}}
  @keyframes zcF{from{opacity:0}to{opacity:1}}
  #list.st{animation:zcF .32s ease-out}
  .week .days button.pop{animation:zcPop .3s ease-out}
  .week .days.aR .dots i,.week .days.aL .dots i{animation:zcDot .3s ease-out .1s backwards}
  .week .days.month.aD button.m{animation:zcUp .26s ease-out both;animation-delay:calc(var(--r,0)*35ms)}
  @keyframes zcBi{from{opacity:0}to{opacity:.5}}
  @keyframes zcBo{from{opacity:.5}to{opacity:0}}
  .banner.fade>svg{animation:zcBi .6s ease-in-out}
  .banner .old{position:absolute;inset:0}.banner .old svg{animation:zcBo .6s ease-in-out forwards}
  @media (prefers-reduced-motion:reduce){#list.st,.week .days button.pop,.week .days .dots i,.week .days.month.aD button.m,.banner.fade>svg,.banner .old svg{animation:none!important}}
  @keyframes zcR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
  @keyframes zcL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
  @keyframes zcD{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .aR{animation:zcR .24s ease-out}.aL{animation:zcL .24s ease-out}.aD{animation:zcD .22s ease-out}
  @media (prefers-reduced-motion:reduce){.aR,.aL,.aD{animation:none}}
  #weekstrip{touch-action:none}
  .wkhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;color:var(--chipInk);font-weight:600;font-size:.9rem}
  .wkhead button{display:inline-flex;align-items:center;justify-content:center;width:36px;height:32px;padding:0;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .wkhead button svg{display:block}
  .wkhead button:disabled{opacity:.35;cursor:default}
  .week .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .week .days button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 7px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
  .week .wd{font-size:.72rem;color:var(--muted)}
  .week .dn{font-weight:700;font-size:1.05rem}
  .week .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:10px}
  .week .dots i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
  .week .days button.none{opacity:.6}
  /* past days: flat and crossed off; weekend/holiday: tinted (darker in light theme, lighter in dark); today: ring */
  .week .days button.past{opacity:1;cursor:default;background:transparent;border-color:transparent;color:var(--muted)}
  .week .days button.past .dn{opacity:.5}
  .week .days button.past .wd{opacity:.5}
  .week .days button.m.out.past{opacity:.6}
  .week .days button.off:not(.past):not([aria-pressed="true"]){background:var(--off)}
  .week .days button.today{border-color:var(--chipInk);border-width:1.5px}
  .week .days button.today:not([aria-pressed="true"]) .dn{color:var(--chipInk)}
  .week .days button[aria-pressed="true"]{background:var(--pressed);color:var(--pressedInk);border-color:var(--pressed)}
  .week .days button.today[aria-pressed="true"]{border-color:var(--chipInk);box-shadow:inset 0 0 0 1.5px var(--off)}
  .week .days button[aria-pressed="true"] .wd{color:inherit;opacity:.85}
  .week .days button[aria-pressed="true"] .dots i{border-color:#fff}
  .wkhead .lbl{flex:1;width:auto;height:32px;margin:0 8px;gap:8px;border:1px solid var(--pressed);background:var(--card);color:var(--pressed);font:inherit;font-weight:700;font-size:.92rem;}
  .wkhead .lbl .chev{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--pressed);color:var(--pressedInk)}
  .wkhead .lbl[aria-expanded="true"] .chev svg{transform:rotate(180deg)}
  .week .days.month{gap:4px;grid-template-columns:20px repeat(7,1fr)}
  .week .wn{display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);opacity:.85}
  .week .wdh{text-align:center;font-size:.72rem;color:var(--muted);}
  .week .days button.m{padding:4px 0 5px;border-radius:10px;border-width:1px}
  .week .days button.m.out{opacity:.45}
  .week .dots i.d{width:18px;border-radius:0}
  .week .dots i.d.st{border-radius:999px 0 0 999px}
  .week .dots i.d.en{border-radius:0 999px 999px 0}
  .week .dots i.d.st.en{border-radius:999px}
  .week .dots i.s{border-radius:1px;transform:rotate(45deg) scale(.82)}
  .legend{display:flex;gap:14px;justify-content:center;margin-top:7px;font-size:.72rem;color:var(--muted)}
  .legend i{display:inline-block;width:9px;height:9px;background:var(--muted);vertical-align:0;margin-right:3px;border-radius:50%}
  .legend i.s{border-radius:1px;transform:rotate(45deg) scale(.82)}.legend i.d{width:16px;height:8px;border-radius:999px}
  h2.day{font-size:1rem;margin:22px 0 8px;color:var(--chipInk);}
  .ev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px}
  .ev h3{margin:0 0 2px;font-size:1.05rem}
  .toprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
  .foot .meta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}
  .foot a.go{flex:none}
  @media (max-width:520px){a.go .lead{display:none}}
  .tag.verify{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
  .city{display:inline-block;color:#fff;font-size:.78rem;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:2px 10px}
  .meta{color:var(--muted);font-size:.93rem}
  .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{background:var(--chip);color:var(--chipInk);border-radius:999px;padding:2px 10px;font-size:.8rem}
  .tag.type{background:var(--pressed);color:var(--pressedInk)}
  .note{margin-top:6px;font-size:.88rem;color:var(--muted)}
  a.go{display:inline-block;margin:0;background:var(--pressed);color:var(--pressedInk);border:1px solid rgba(255,255,255,.22);font-weight:700;text-decoration:none;padding:7px 14px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
  a.go:hover{filter:brightness(1.08)}
  a.go:active{transform:translateY(1px);box-shadow:none}
  .empty{padding:32px 0;text-align:center;color:var(--muted)}
  footer{max-width:820px;margin:32px auto;padding:0 16px 40px;color:var(--muted);font-size:.9rem}
  .submit{display:inline-block;background:var(--pressed);color:var(--pressedInk);border-radius:999px;padding:8px 16px;text-decoration:none;font-weight:600}
  .submit.off{background:var(--line);color:var(--muted);pointer-events:none}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  /* card: content + full-height details button */
  .ev{display:flex;align-items:stretch;padding:0;overflow:hidden}
  .content{flex:1;min-width:0;padding:11px 14px}
  .ev a.go{flex:none;display:flex;align-items:center;justify-content:center;text-align:center;width:92px;padding:0 10px;margin:0;border:0;border-left:1px solid var(--line);border-radius:0;box-shadow:none;font-size:.9rem;line-height:1.25}
  a.go .lead{display:none}
  @media (min-width:700px){.ev a.go{width:150px;font-size:1rem}a.go .lead{display:inline}}
  .cal{margin-left:auto;font-size:.8rem;font-weight:600;color:var(--chipInk);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
  .cal:hover{background:var(--chip)}
  @media (max-width:520px){
    .cal .txt{display:none}.cal{padding:2px 8px;font-size:.9rem}
    .ev a.go{width:88px;font-size:.8rem;padding:0 6px}
    .top{display:block;position:relative}.tools{position:static;margin-top:10px}
    .content{padding:10px 12px}
    .wrap{padding:0 12px}
  }
  .cal{display:inline-flex;align-items:center;gap:5px}
  .cal svg{flex:none}
  .updated{font-size:.78rem;opacity:.75;margin-top:3px}

  /* ---- v1.9.6: compact mobile layout ---- */
  @media (max-width:520px){
    /* header: title on the left, language menu + theme on the right (no extra row) */
    .top{display:flex;align-items:flex-start;gap:10px}
    .top .ttl{flex:1;min-width:0}
    .tools{margin-top:0;flex:none;gap:6px}
    .tools button{padding:5px 10px;font-size:.85rem}
    .langbtn{display:inline-flex;align-items:center;gap:5px}
    .langs{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:40;flex-direction:column;gap:2px;min-width:160px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.28)}
    .langs.open{display:flex}
    .tools .langs button{background:transparent;color:var(--ink);border:0;border-radius:10px;text-align:left;padding:9px 12px;font-size:.95rem}
    .tools .langs button::after{content:" \00B7  " attr(data-full);color:var(--muted);font-weight:400}
    .tools .langs button[aria-pressed="true"]{background:var(--chip);color:var(--chipInk);font-weight:700}
    h1{font-size:clamp(1.05rem,5vw,1.35rem);white-space:nowrap}
    /* filters */
    .controls{padding:17px 0 9px}
    .what{gap:6px;margin-bottom:6px}
    .what button{padding:5px 4px;border-radius:12px;border-width:1.5px;font-size:.88rem;line-height:1.15}
    .filters{gap:6px;padding:0 0 4px}
    .filters .grp{gap:6px}
    .pill{padding:4px 11px;font-size:.88rem}
    .dot{width:9px;height:9px;margin-right:5px}
    /* week strip */
    .week{margin:8px 0 0}
    .wkhead{margin-bottom:9px}
    .wkhead button{height:28px;width:32px}
    .wkhead .lbl{height:28px;font-size:.88rem}
    .week .days{gap:5px}
    .week .days button{padding:3px 0 5px}
    .week .dn{font-size:1rem}
    .legend{margin-top:5px}
    h2.day{margin:16px 0 6px}
    /* cards: calendar button pinned top-right, details button as a narrow rotated column */
    .ev{min-height:92px}
    .content{position:relative;padding:9px 10px}
    .toprow{padding-right:34px;margin-bottom:5px}
    .cal{position:absolute;top:8px;right:8px;margin:0;padding:3px 7px}
    .ev a.go{width:36px;padding:0;writing-mode:vertical-rl;font-size:.8rem;letter-spacing:.03em}
    .ev a.go>span{text-align:center}
    .ev a.go .arr{display:none}
  }
</style>
</head>
<body>
<header><div class="deco" aria-hidden="true"></div><div class="wrap">
  <div class="top">
    <div class="ttl">
      <h1>Zouk Calendar Hungary</h1>
      <p id="tagline"></p>
      <div class="updated"><span id="updLabel"></span> <span id="upd"></span></div>
    </div>
    <div class="tools">
      <div class="lw">
        <button id="langBtn" class="langbtn" type="button" aria-haspopup="true" aria-expanded="false"></button>
        <div class="langs" id="langs">
          <button id="langHU" data-lang="hu" data-full="Magyar" aria-pressed="false">HU</button>
          <button id="langEN" data-lang="en" data-full="English" aria-pressed="false">EN</button>
          <button id="langES" data-lang="es" data-full="Español" aria-pressed="false">ES</button>
          <button id="langPT" data-lang="pt" data-full="Português" aria-pressed="false">PT</button>
        </div>
      </div>
      <button id="theme" aria-label="Theme"></button>
    </div>
  </div>
</div></header>

<div class="wrap">
  <div class="controls">
    <div class="banner" id="banner" aria-hidden="true"></div>
    <div class="what" id="what" role="group">
      <button data-v="all"></button>
      <button data-v="class"></button>
      <button data-v="party"></button>
    </div>
    <div class="filters" role="group">
      <span class="grp" id="when">
        <button class="pill" data-v="today"></button>
        <button class="pill" data-v="all"></button>
      </span>
      <span class="sep"></span>
      <span class="grp" id="cities"></span>
      <span style="flex:none;width:24px"></span>
    </div>
  </div>
  <div class="week" id="weekstrip" hidden></div>
  <main id="list" aria-live="polite"></main>
</div>

<footer>
  <p><a id="submitLink" class="submit" target="_blank" rel="noopener"></a></p>
  <p id="disclaimer"></p>
</footer>

<script src="events.js"></script>

      if(!GROUP[type]||!validISO(start)||(end&&!validISO(end)))continue;     // skip malformed rows
      var th=g("title_hu"),te=g("title_en");if(!th&&!te)continue;
      var e={id:g("id")||slugId(start+"-"+(th||te)),title:te&&th&&te!==th?{hu:th,en:te}:(th||te),
        start:start,end:end,time:g("time"),endTime:g("endtime"),city:g("city"),venue:g("venue"),type:type,
        organizer:g("organizer"),url:/^https?:\/\//i.test(url)?url:""};
      var also=g("also").toLowerCase();if(GROUP[also])e.also=also;
      var st=g("styles").toLowerCase().split(/[,;]\s*/).filter(Boolean);e.styles=st.length?st:["zouk"];
      var mx=g("mixed").toLowerCase();
      if(mx&&["false","hamis","0","no","nem"].indexOf(mx)<0){e.mixed=["true","igaz","1","yes","igen","jóváhagyva"].indexOf(mx)>-1?true:mx.split(/[,;]\s*/).filter(Boolean);}
      if(["true","igaz","1","yes","igen","jóváhagyva"].indexOf(g("verify").toLowerCase())>-1)e.verify=true;
      var nh=g("note_hu"),ne=g("note_en");if(nh||ne)e.note=nh&&ne&&nh!==ne?{hu:nh,en:ne}:(nh||ne);
      var wk=parseInt(g("weekly"),10);
      if(wk>=1&&wk<=7){var fr=g("from")||start;if(validISO(fr)){e.weekly=wk;e.from=fr;}}
      out.push(e);
    }
    return out;
  }
  function useEvents(list,upd){window.ZC_EVENTS=list;window.ZC_UPDATED=upd;update();}
  function loadLive(){
    var u=(window.ZC_CONFIG||{}).csvUrl;if(!u)return;
    var ctl=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort();},8000);
    fetch(u+(u.indexOf("?")>-1?"&":"?")+"_="+Date.now(),{cache:"no-store",signal:ctl?ctl.signal:undefined})
      .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text();})
      .then(function(txt){
        clearTimeout(tm);var list=csvToEvents(txt),nr=Math.max(parseCSV(txt).length-1,0);
        console.info("Zouk Calendar: CSV rows "+nr+", usable approved events "+list.length);
        if(!list.length)throw new Error("no approved rows (CSV rows: "+nr+")");
        var day=todayISO();
        try{localStorage.setItem(CSV_KEY,JSON.stringify({at:day,events:list}));}catch(e){}
        useEvents(list,day);
      })
      .catch(function(err){clearTimeout(tm);console.warn("Zouk Calendar: using the built-in list – "+(err&&err.message||err));if(usedCache)useEvents(FALLBACK,FALLBACK_UPD);});
  }
  // first paint: last good sheet data from this browser, otherwise events.js
  if((window.ZC_CONFIG||{}).csvUrl){
    try{var cc=JSON.parse(localStorage.getItem(CSV_KEY)||"null");if(cc&&cc.events&&cc.events.length){window.ZC_EVENTS=cc.events;window.ZC_UPDATED=cc.at;usedCache=true;}}catch(e){}
  }

  update();
  loadLive();
})();
</script>
